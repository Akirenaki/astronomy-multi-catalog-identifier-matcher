name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

      - name: Check for pending Alembic model changes
        run: |
          rm -f ./_ci_alembic_check.db
          DATABASE_URL="sqlite+aiosqlite:///./_ci_alembic_check.db" alembic upgrade head
          DATABASE_URL="sqlite+aiosqlite:///./_ci_alembic_check.db" alembic check